path:
  data_dir: "./data"
  img_dir: "./data/images_raw"
  output_dir: "./data/output"
  json_dir: "./data/json"

yolo:
  model_path: "models/yolo11x.pt"
  return_vis: true

ocr:
  return_vis: true
  langs:
    - "ko"
    - "en"

captioning:
  model: "Salesforce/instructblip-vicuna-7b"
  prompt: "Describe the scene’s atmosphere and key features realistically. Focus on clear, observable elements. Mention emotions only if strongly implied."

LLM:
  model: "google/gemma-3-12b-it"
  prompt_template: >
    Caption: "{caption}"
    Does this caption realistically describe the atmosphere or feeling of a place without exaggeration, making it suitable for emotional hashtags?  
    Answer in one word: Suitable or Unsuitable.
  suitable_keywords: ["suitable"]
  unsuitable_keywords: ["unsuitable"]
  skip_if_judged: true
  max_new_tokens: 30
  response_field_name: "LLM_response"
  temperature: 0.7
  top_p: 0.9

caption_filtering:
  food_keywords:
    - bowl
    - pizza
    - ramen
    - cake
    - dish
    - plate
    - steak
    - burger
    - fries
    - sushi
    - spoon
    - fork

  emotional_keywords:
    - window
    - sunset
    - book
    - flower
    - cat
    - dog
    - rain
    - candle
    - face
    - smile
    - couple
    - person
    - lamp
    - street
    - bed
path:
  data_dir: "./data"
  img_dir: "./data/images_raw"
  output_dir: "./data/output"
  json_dir: "./data/json"

yolo:
  model_path: "models/yolo11x.pt"
  return_vis: true

clip:
  model: "openai/clip-vit-base-patch32"
  prompts:
    scene:
      - "a wide view of an indoor or outdoor place"
      - "a photo showing an entire environment"
    object:
      - "a close-up photo of an object"
      - "a photo focusing on a single item without background"

ocr:
  return_vis: true
  langs:
    - "ko"
    - "en"

captioning:
  model: "llava-hf/llava-1.5-7b-hf"
  prompt: >
    You must answer based only on visible elements in the image. Do not guess or imagine.

    Answer strictly in the following format:

    1) Indoor or Outdoor: ("Indoor" or "Outdoor")
    2) Main objects visible: (List 2-3 main visible objects, separated by commas. Only objects clearly visible. No repetition.)
    3) Environment setting: (Describe in one short, factual sentence without assumptions.)

    Do not invent or assume any objects or details.
    Only output the answers exactly as asked.

LLM:
  model: "google/gemma-3-12b-it"
  prompt_template: >
    Caption: "{caption}"
    Is this caption factual and sufficient for hashtag generation?
    Reply only “Suitable” or “Unsuitable”.
  suitable_keywords: ["suitable"]
  unsuitable_keywords: ["unsuitable"]
  skip_if_judged: true
  max_new_tokens: 30
  response_field_name: "LLM_response"
  temperature: 0.7
  top_p: 0.9

caption_filtering:
  food_keywords:
    - bowl
    - pizza
    - ramen
    - cake
    - dish
    - plate
    - steak
    - burger
    - fries
    - sushi
    - spoon
    - fork

  emotional_keywords:
    - window
    - sunset
    - book
    - flower
    - cat
    - dog
    - rain
    - candle
    - face
    - smile
    - couple
    - person
    - lamp
    - street
    - bed
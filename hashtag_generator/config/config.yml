path:
  data_dir: "./data"
  cafe_img_dir: "./data/cafe"
  restaurant_img_dir: "./data/restaurant"
  attraction_img_dir: "./data/attraction"
  output_dir: "./data/output"
  json_dir: "./data/json"
  statistics_dir: "./data/statistics"

yolo:
  model_path: "models/yolo11x.pt"
  return_vis: true

clip:
  model: "openai/clip-vit-base-patch32"
  prompts:
    scene:
      - "a wide view of an indoor space"
      - "a panoramic view of an outdoor environment"
      - "an entire photo of a public place"
      - "a wide shot of a library hall"
    object:
      - "a close-up of a cup on a table"
      - "a close-up of a product with no background"
      - "a plate of food"
      - "a hand holding a small item"

ocr:
  return_vis: true
  langs:
    - "ko"
    - "en"

captioning:
  model: "Salesforce/instructblip-vicuna-7b"
  llava_model: "llava-hf/llava-1.5-7b-hf"
  prompt: >
    Describe the overall scene in 1 to 3 short and clear sentences.
    Only mention what is clearly visible in the image. Avoid any guesses.

    Example: A group of people are hiking on a mountain trail.

    Caption:

LLM:
  model: "google/gemma-3-12b-it"
  prompt: >
    Caption: "A close-up of a coffee cup."
    Answer: Unsuitable

    Caption: "A coffee cup on a wooden table in a cozy cafe."
    Answer: Suitable

    Caption: "{caption}"
    Answer:

  suitable_keywords: ["suitable"]
  unsuitable_keywords: ["unsuitable"]
  skip_if_judged: true
  max_new_tokens: 10
  response_field_name: "LLM_response"
  temperature: 0.2
  top_p: 0.9

caption_filtering:
  food_keywords:
    - bowl
    - pizza
    - ramen
    - cake
    - dish
    - plate
    - steak
    - burger
    - fries
    - sushi
    - spoon
    - fork

  emotional_keywords:
    - window
    - sunset
    - book
    - flower
    - cat
    - dog
    - rain
    - candle
    - face
    - smile
    - couple
    - person
    - lamp
    - street
    - bed

hashtag:
  model: "gpt-4o-2024-11-20"
  detail: "low"
  temperature: 0.8
  max_tokens: 150

  cafe_prompt: >
    이 이미지는 감성적인 분위기의 카페를 담고 있어.
    공간의 채광, 가구 배치, 여백, 식물, 음료 등의 무드를 살려서
    감성적이고 센스 있는 인스타그램 해시태그 10개를 한국어로 만들어줘.
    너무 일반적이지 않으면서도 자연스럽고, 실제 감성 계정에서 쓸 법한 스타일로.

  restaurant_prompt: >
    이 이미지는 음식점 또는 레스토랑의 장면이야.
    음식의 비주얼, 테이블 세팅, 조명, 분위기 등을 바탕으로
    맛과 공간의 매력을 감성적으로 표현한 인스타그램 해시태그 10개를 만들어줘.
    흔하지 않지만 공감 가는 짧고 센스 있는 스타일이면 좋아.

  accommodation_prompt: >
    이 이미지는 숙소 또는 머물고 싶은 공간을 담고 있어.
    채광, 침구, 조명, 인테리어 등 편안한 무드와 공간의 분위기를 반영해서
    감성적이고 차분한 인스타그램 해시태그 10개를 만들어줘.
    너무 직접적이지 않게, 따뜻한 느낌이 들도록 자연스럽게 표현해줘.

  travel_prompt: >
    이 이미지는 여행지 또는 관광지를 담은 장면이야.
    풍경, 구조물, 색감, 채광 등 시각적 요소를 중심으로
    그 순간의 감성과 분위기를 자연스럽게 표현한 인스타그램 해시태그 10개를 만들어줘.
    독창적이지만 과하게 튀지 않고, 감정을 자극하는 표현이면 좋아.
